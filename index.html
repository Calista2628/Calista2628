<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, responsive, and accessible modern web calculator.">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-container" role="region" aria-label="Calculator Application">
    <header class="calculator-header">
      <div class="header-title">
        <span class="app-icon" aria-hidden="true">🧮</span>
        <h1>Calculator</h1>
      </div>
      <div class="header-actions">
        <button id="history-toggle-btn" class="icon-btn" aria-label="Toggle calculation history" title="History (H)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle dark/light theme" title="Toggle Theme (T)">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="calculator-body">
      <!-- Calculator Display -->
      <div class="display" role="region" aria-live="polite" aria-atomic="true">
        <div id="previous-operand" class="previous-operand" aria-label="Previous expression"></div>
        <div id="current-operand" class="current-operand" aria-label="Current value">0</div>
      </div>

      <!-- History Panel (Collapsible) -->
      <div id="history-panel" class="history-panel hidden" aria-hidden="true">
        <div class="history-header">
          <span>Recent Calculations</span>
          <button id="clear-history-btn" class="clear-history-btn" title="Clear history">Clear</button>
        </div>
        <ul id="history-list" class="history-list" role="list">
          <li class="history-empty">No calculations yet</li>
        </ul>
      </div>

      <!-- Keypad -->
      <div class="keypad" role="group" aria-label="Calculator keypad">
        <!-- Row 1 -->
        <button class="btn btn-secondary" data-action="all-clear" aria-label="All Clear" title="Escape">AC</button>
        <button class="btn btn-secondary" data-action="clear-entry" aria-label="Clear Entry">CE</button>
        <button class="btn btn-secondary" data-action="toggle-sign" aria-label="Toggle Sign">±</button>
        <button class="btn btn-operator" data-operation="÷" aria-label="Divide by">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-number" data-number="7">7</button>
        <button class="btn btn-number" data-number="8">8</button>
        <button class="btn btn-number" data-number="9">9</button>
        <button class="btn btn-operator" data-operation="×" aria-label="Multiply by">×</button>

        <!-- Row 3 -->
        <button class="btn btn-number" data-number="4">4</button>
        <button class="btn btn-number" data-number="5">5</button>
        <button class="btn btn-number" data-number="6">6</button>
        <button class="btn btn-operator" data-operation="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="btn btn-number" data-number="1">1</button>
        <button class="btn btn-number" data-number="2">2</button>
        <button class="btn btn-number" data-number="3">3</button>
        <button class="btn btn-operator" data-operation="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="btn btn-secondary" data-action="percent" aria-label="Percent">%</button>
        <button class="btn btn-number" data-number="0">0</button>
        <button class="btn btn-number" data-number="." aria-label="Decimal point">.</button>
        <button class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </div>

    <!-- Keyboard Shortcuts Legend Footer -->
    <footer class="calculator-footer">
      <small>Keyboard: <code>0-9</code> <code>+ - * /</code> <code>Enter</code> <code>Esc</code> <code>Backspace</code></small>
    </footer>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
